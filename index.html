<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, shrink-to-fit=no, user-scalable=no">
<title>✦ 排列圣殿 · 十一关 ✦</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI','PingFang SC','Noto Sans SC',sans-serif}
body{background:linear-gradient(145deg,#e8e4f0,#f5f2fa);display:flex;justify-content:center;align-items:center}
.game-wrap{width:100vw;height:100vh;max-width:100%;max-height:100%;background:linear-gradient(160deg,#ffffff 0%,#f8f6fc 40%,#f0ecf8 100%);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 60px rgba(80,40,160,0.06),inset 0 1px 0 rgba(255,255,255,0.9)}
.game-wrap::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 70% 20%,rgba(120,60,200,0.02),transparent 60%);pointer-events:none;z-index:0}

/* ===== 顶栏 ===== */
.topbar{position:relative;z-index:10;background:linear-gradient(135deg,#f5f0ff,#ede8fe);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(120,80,180,0.08);flex-shrink:0;backdrop-filter:blur(20px)}
.topbar h1{color:#3a2860;font-size:clamp(0.75rem,1.6vw,1.2rem);letter-spacing:1.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.topbar h1 .accent{background:linear-gradient(135deg,#8a5cc0,#6a3ca0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lv-badge{background:linear-gradient(135deg,#e8dfff,#d8c8f8);color:#5a3a88;font-size:clamp(0.5rem,0.9vw,0.65rem);padding:3px 12px;border-radius:30px;border:1px solid rgba(120,80,180,0.12);box-shadow:0 0 12px rgba(120,80,200,0.03)}
.btn-reset{background:linear-gradient(135deg,#e06070,#f07080);color:#fff;border:none;padding:6px 16px;border-radius:30px;font-size:clamp(0.6rem,1vw,0.8rem);cursor:pointer;transition:all 0.3s cubic-bezier(0.2,0.9,0.4,1);font-weight:600;white-space:nowrap;box-shadow:0 2px 12px rgba(200,60,80,0.15);letter-spacing:0.5px}
.btn-reset:hover{background:linear-gradient(135deg,#f07080,#f08090);transform:translateY(-1px);box-shadow:0 4px 20px rgba(200,60,80,0.2)}
.btn-reset:active{transform:translateY(0) scale(0.97)}

/* ===== 主区域 ===== */
.main-body{display:flex;flex:1;min-height:0;position:relative;z-index:1}
.room-scene{flex:1;display:flex;flex-direction:column;padding:8px 10px;min-width:0}
.room-title{color:rgba(80,50,120,0.5);font-size:clamp(0.55rem,0.9vw,0.75rem);margin-bottom:6px;letter-spacing:2px;border-left:3px solid rgba(120,80,180,0.15);padding-left:10px;flex-shrink:0;font-weight:300}
.room-interior{flex:1;border-radius:16px;position:relative;overflow:hidden;border:1px solid rgba(120,80,180,0.06);min-height:0;background-size:contain;background-position:center center;background-repeat:no-repeat;background-color:#fcfaff;box-shadow:inset 0 0 40px rgba(120,80,180,0.02),0 0 20px rgba(80,40,160,0.02)}
.room-interior::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 80%,rgba(120,80,180,0.02),transparent 70%);pointer-events:none;z-index:1}

/* ===== 可点击热点 ===== */
.hotspot{position:absolute;cursor:pointer;z-index:30;border:2px solid rgba(120,80,180,0);border-radius:14px;transition:all 0.35s cubic-bezier(0.2,0.9,0.4,1);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0)}
.hotspot::before{content:'';position:absolute;inset:-4px;border-radius:18px;background:radial-gradient(ellipse at center,rgba(120,80,200,0.03),transparent 70%);opacity:0;transition:opacity 0.4s}
.hotspot:hover::before{opacity:1}
.hotspot:hover{border-color:rgba(120,80,180,0.15);background:rgba(120,80,200,0.04);box-shadow:0 0 24px rgba(100,60,200,0.06),inset 0 0 20px rgba(100,60,200,0.02);transform:scale(1.04)}
.hotspot:active{transform:scale(0.96)}
.hotspot .hot-label{background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);color:#3a2860;font-size:clamp(0.45rem,0.9vw,0.65rem);padding:3px 12px;border-radius:30px;opacity:0;transition:all 0.3s;pointer-events:none;border:1px solid rgba(120,80,180,0.08);white-space:nowrap;font-weight:500;letter-spacing:0.5px}
.hotspot:hover .hot-label{opacity:1;transform:translateY(-2px)}
@media(hover:none)and(pointer:coarse){.hotspot .hot-label{opacity:1;font-size:clamp(0.4rem,1.1vw,0.6rem);padding:2px 8px}}
.hotspot.collected{border-color:rgba(60,180,120,0.2);background:rgba(60,180,120,0.04)}
.hotspot.collected::after{content:'✓';position:absolute;top:-8px;right:-8px;background:linear-gradient(135deg,#2ecc71,#1a9a50);color:#fff;border-radius:50%;width:clamp(18px,3vw,26px);height:clamp(18px,3vw,26px);font-size:clamp(0.55rem,1vw,0.75rem);display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 2px 12px rgba(46,204,113,0.2);z-index:11;border:1px solid rgba(255,255,255,0.4)}

/* ===== NPC对话 ===== */
.npc-dialogue{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:16px 16px 12px;background:linear-gradient(transparent,rgba(245,240,255,0.88) 25%);pointer-events:none;transition:opacity 0.5s}
.npc-dialogue.hidden{opacity:0;pointer-events:none}
.npc-dialogue .bubble{max-width:100%;background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);border-radius:18px;padding:12px 18px;border:1px solid rgba(120,80,180,0.06);box-shadow:0 8px 40px rgba(80,40,160,0.06);pointer-events:auto;transition:all 0.4s cubic-bezier(0.2,0.9,0.4,1);opacity:0;transform:translateY(20px)}
.npc-dialogue .bubble.visible{opacity:1;transform:translateY(0)}
.npc-dialogue .bubble.hidden{opacity:0;transform:translateY(24px);pointer-events:none}
.npc-header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.npc-avatar{width:clamp(28px,3.5vw,38px);height:clamp(28px,3.5vw,38px);border-radius:50%;background:linear-gradient(145deg,#ede6fe,#f5f0ff);display:flex;align-items:center;justify-content:center;font-size:clamp(14px,2vw,20px);border:2px solid rgba(120,80,180,0.1);flex-shrink:0;box-shadow:0 0 20px rgba(100,60,200,0.03)}
.npc-name{font-size:clamp(11px,1.2vw,14px);font-weight:600;color:#5a3a88;letter-spacing:0.5px}
.npc-name span{color:rgba(80,50,120,0.3);font-weight:300;font-size:clamp(9px,0.9vw,11px);margin-left:6px}
.npc-text{color:#3a2860;font-size:clamp(12px,1.3vw,15px);line-height:1.65;min-height:40px;padding:0 2px}
.npc-text .hl{color:#8a5cc0;font-weight:600;text-shadow:0 0 8px rgba(120,80,200,0.08)}
.npc-hint{text-align:right;color:rgba(120,80,180,0.25);font-size:clamp(9px,0.9vw,11px);margin-top:4px;letter-spacing:2px;animation:softPulse 1.6s infinite}
@keyframes softPulse{0%,100%{opacity:0.3}50%{opacity:0.8}}

/* ===== 侧边线索面板 ===== */
.side-panel{width:200px;min-width:160px;background:linear-gradient(180deg,#f8f4fe,#faf6ff);padding:14px 12px;border-left:1px solid rgba(120,80,180,0.04);display:flex;flex-direction:column;flex-shrink:0;position:relative;z-index:5}
.side-panel h3{color:#6a4a9a;font-size:clamp(0.6rem,0.9vw,0.8rem);margin-bottom:8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid rgba(120,80,180,0.04);padding-bottom:8px;flex-shrink:0;letter-spacing:1px;font-weight:500}
.side-panel h3 .count{color:rgba(80,50,120,0.3);font-size:0.7rem;font-weight:300;margin-left:auto}
.clue-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;padding-right:2px}
.clue-list::-webkit-scrollbar{width:3px}
.clue-list::-webkit-scrollbar-track{background:transparent}
.clue-list::-webkit-scrollbar-thumb{background:rgba(120,80,180,0.08);border-radius:10px}
.clue-card{background:linear-gradient(135deg,#f8f4ff,#fcfaff);border-radius:12px;padding:8px 12px;border-left:3px solid rgba(180,80,60,0.15);color:#3a2860;font-size:clamp(0.55rem,0.8vw,0.68rem);line-height:1.4;animation:cardIn 0.35s cubic-bezier(0.2,0.9,0.4,1);box-shadow:0 1px 8px rgba(80,40,160,0.02);flex-shrink:0;border:1px solid rgba(120,80,180,0.03)}
.clue-card .emoji{margin-right:4px;font-size:0.85rem}
.clue-card.special{border-left-color:rgba(200,160,40,0.4);background:linear-gradient(135deg,#fefcf4,#fcfaf0);color:#6a5a20;border-color:rgba(200,160,40,0.04)}
@keyframes cardIn{from{opacity:0;transform:translateX(16px) scale(0.95)}to{opacity:1;transform:translateX(0) scale(1)}}
.clue-empty{color:rgba(80,50,120,0.15);font-size:0.65rem;text-align:center;margin-top:24px;line-height:1.6;letter-spacing:1px}
.progress-wrap{margin-top:10px;padding-top:8px;border-top:1px solid rgba(120,80,180,0.04);font-size:clamp(0.45rem,0.7vw,0.55rem);color:rgba(80,50,120,0.15);flex-shrink:0;letter-spacing:0.5px}
.progress-wrap .bar{height:4px;background:rgba(120,80,180,0.06);border-radius:6px;margin-top:5px;overflow:hidden}
.progress-wrap .bar-fill{height:100%;background:linear-gradient(90deg,#8a5cc0,#c090e8);border-radius:6px;transition:width 0.6s cubic-bezier(0.2,0.9,0.4,1);box-shadow:0 0 10px rgba(120,80,200,0.08)}

/* ===== 底部栏 ===== */
.footer-bar{position:relative;z-index:10;background:linear-gradient(135deg,#f5f0ff,#f8f4fe);padding:8px 14px;border-top:1px solid rgba(120,80,180,0.04);display:flex;align-items:center;gap:8px;flex-shrink:0;min-height:36px}
.footer-bar .icon{font-size:clamp(0.75rem,0.9vw,0.9rem);color:rgba(80,50,120,0.15);flex-shrink:0}
.footer-bar .msg{color:rgba(60,40,90,0.35);font-size:clamp(0.6rem,0.9vw,0.75rem);flex:1;font-weight:350;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:0.5px}

/* ===== 弹窗（线索/密码箱）===== */
.modal-overlay,.pin-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(200,180,230,0.4);backdrop-filter:blur(8px);justify-content:center;align-items:center;z-index:999}
.modal-overlay.active,.pin-overlay.active{display:flex}
.modal-box,.pin-box{background:linear-gradient(160deg,#ffffff,#fcfaff);border-radius:24px;padding:26px 22px 22px;max-width:420px;width:90%;border:1px solid rgba(120,80,180,0.06);box-shadow:0 30px 80px rgba(80,40,160,0.08);animation:modalPop 0.4s cubic-bezier(0.2,0.9,0.4,1.1);position:relative;max-height:90vh;overflow-y:auto}
@keyframes modalPop{from{transform:scale(0.88) rotate(-0.5deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.modal-box .close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:rgba(80,50,120,0.15);font-size:1.4rem;cursor:pointer;transition:all 0.3s}
.modal-box .close-btn:hover{color:#e06070;transform:rotate(90deg)}
.modal-box .card-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.modal-box .card-header .big-icon{font-size:2rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.04))}
.modal-box .card-header .card-title{color:#3a2860;font-size:1rem;font-weight:600;letter-spacing:0.5px}
.modal-box .card-body{background:linear-gradient(135deg,#faf8fe,#fcfaff);border-radius:16px;padding:16px;color:#3a2860;font-size:0.82rem;line-height:1.7;border:1px solid rgba(120,80,180,0.03);min-height:60px}
.modal-box .card-body .hl{color:#8a5cc0;font-weight:600}
.modal-box .card-body .em{color:#c06860;font-weight:600}
.modal-box .got-it-btn{margin-top:16px;background:linear-gradient(135deg,#8a5cc0,#6a3ca0);color:#fff;border:none;padding:8px 30px;border-radius:40px;font-size:0.82rem;cursor:pointer;font-weight:500;transition:all 0.3s;display:block;margin-left:auto;letter-spacing:0.5px;box-shadow:0 2px 12px rgba(100,60,180,0.12)}
.modal-box .got-it-btn:hover{background:linear-gradient(135deg,#9a6cd0,#7a4cb0);transform:translateY(-1px);box-shadow:0 4px 20px rgba(100,60,180,0.18)}
.modal-box .got-it-btn:active{transform:translateY(0) scale(0.97)}
.pin-box h2{color:#3a2860;text-align:center;margin-bottom:2px;font-size:1.15rem;letter-spacing:1px}
.pin-box .sub{color:rgba(80,50,120,0.2);text-align:center;font-size:0.7rem;margin-bottom:12px;letter-spacing:2px}
.pin-display{background:linear-gradient(135deg,#f5f0ff,#faf6ff);border-radius:16px;padding:12px;text-align:center;font-size:1.8rem;letter-spacing:12px;font-weight:600;color:#4a8a60;font-family:'Courier New',monospace;margin-bottom:14px;border:1px solid rgba(60,180,120,0.08);box-shadow:inset 0 0 20px rgba(0,0,0,0.02)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pin-pad button{background:linear-gradient(145deg,#f8f4fe,#fcfaff);border:none;padding:12px;border-radius:16px;color:#3a2860;font-size:1.15rem;font-weight:500;cursor:pointer;transition:all 0.15s;box-shadow:0 3px 0 #e8e0f8,0 0 12px rgba(0,0,0,0.02);border:1px solid rgba(120,80,180,0.02)}
.pin-pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #e8e0f8}
.pin-pad .fn{background:linear-gradient(145deg,#f0ecf8,#f5f0fc);font-size:0.8rem;color:rgba(80,50,120,0.4)}
.pin-actions{display:flex;gap:10px;justify-content:center}
.pin-actions button{padding:8px 22px;border-radius:40px;border:none;font-weight:500;cursor:pointer;font-size:0.78rem;transition:all 0.3s;letter-spacing:0.5px}
.btn-confirm-pin{background:linear-gradient(135deg,#4abc80,#30a068);color:#fff;box-shadow:0 2px 12px rgba(30,160,100,0.12)}
.btn-confirm-pin:hover{background:linear-gradient(135deg,#5acc90,#40b078);transform:translateY(-1px)}
.btn-cancel-pin{background:linear-gradient(135deg,#e8e0f8,#f0ecf8);color:#5a3a88}

/* ===== 通关画面 ===== */
.victory{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(240,236,248,0.92);backdrop-filter:blur(20px);justify-content:center;align-items:center;z-index:1000;flex-direction:column}
.victory.active{display:flex}
.victory-inner{text-align:center;animation:victoryPop 0.6s cubic-bezier(0.2,0.9,0.4,1.1);max-width:420px;width:88%}
@keyframes victoryPop{from{transform:scale(0.8) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.victory-inner .big-icon{font-size:4.5rem;filter:drop-shadow(0 8px 30px rgba(180,80,60,0.08));animation:victoryFloat 2s ease-in-out infinite}
@keyframes victoryFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.victory-inner h1{background:linear-gradient(135deg,#8a5cc0,#6a3ca0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:1.8rem;margin:12px 0 8px;letter-spacing:3px}
.victory-inner p{color:rgba(60,40,90,0.5);font-size:0.92rem;margin-bottom:20px;line-height:1.7}
.victory-inner .btn-replay,.victory-inner .btn-next{background:linear-gradient(135deg,#8a5cc0,#6a3ca0);color:#fff;border:none;padding:10px 40px;border-radius:60px;font-size:0.95rem;cursor:pointer;font-weight:600;transition:all 0.3s;margin:0 6px;letter-spacing:0.5px;box-shadow:0 2px 16px rgba(100,60,180,0.1)}
.victory-inner .btn-replay:hover,.victory-inner .btn-next:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(100,60,180,0.16)}
.victory-inner .btn-next{background:linear-gradient(135deg,#4abc80,#30a068);box-shadow:0 2px 16px rgba(30,160,100,0.1)}

/* ===== 开场介绍页 ===== */
.intro-overlay{display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background-image:url('intro-bg.jpg');background-size:cover;background-position:center;background-repeat:no-repeat;justify-content:center;align-items:center;z-index:3000;flex-direction:column}
.intro-overlay::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.35);backdrop-filter:blur(6px);z-index:0}
.intro-overlay.hidden{display:none}
.intro-box{max-width:680px;width:92%;padding:24px 28px;text-align:center;position:relative;z-index:1;background:rgba(255,255,255,0.82);backdrop-filter:blur(20px);border-radius:32px;border:1px solid rgba(255,255,255,0.5);box-shadow:0 30px 80px rgba(80,40,160,0.08)}
.intro-title{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;background:linear-gradient(135deg,#7a4ab0,#5a2a90);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;letter-spacing:6px;position:relative;display:inline-block}
.intro-title::after{content:'✨';position:absolute;top:-10px;right:-28px;font-size:1.2rem;-webkit-text-fill-color:initial;animation:sparkle 2s ease-in-out infinite}
@keyframes sparkle{0%,100%{opacity:0.4;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}
.intro-subtitle{color:rgba(80,50,120,0.28);font-size:clamp(0.6rem,1vw,0.78rem);letter-spacing:8px;margin-bottom:18px;font-weight:300}
.intro-text{background:rgba(255,255,255,0.5);backdrop-filter:blur(10px);border-radius:24px;padding:22px 26px;text-align:left;min-height:160px;margin-bottom:14px;box-shadow:0 0 30px rgba(80,40,160,0.01)}
.intro-text .narrator{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:rgba(80,50,120,0.2);font-size:12px;letter-spacing:4px}
.intro-text .content{color:#2a1a4a;font-size:clamp(0.82rem,1.2vw,0.92rem);line-height:1.9;min-height:110px;font-weight:400}
.intro-text .content .hl-gold{color:#a08030;font-weight:600}
.intro-text .content .hl-blue{color:#5080b0;font-weight:600}
.intro-text .content .hl-red{color:#c05050;font-weight:600}
.intro-hint{color:rgba(80,50,120,0.25);font-size:clamp(0.65rem,0.9vw,0.75rem);letter-spacing:5px;animation:softPulse 1.6s infinite;cursor:pointer;padding:6px 0;transition:all 0.3s}

/* ===== 问卷星弹窗 ===== */
.survey-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(200,180,230,0.4);backdrop-filter:blur(8px);justify-content:center;align-items:center;z-index:5000;flex-direction:column}
.survey-overlay.active{display:flex}
.survey-box{background:#ffffff;border-radius:24px;border:1px solid rgba(120,80,180,0.06);box-shadow:0 30px 80px rgba(80,40,160,0.08);animation:surveyPop 0.4s cubic-bezier(0.2,0.9,0.4,1.1);position:relative;max-width:820px;width:94%;padding:0;overflow:hidden;max-height:90vh}
@keyframes surveyPop{from{transform:scale(0.88) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.survey-close{position:absolute;top:12px;right:14px;z-index:10;background:rgba(200,180,230,0.2);border:none;color:rgba(80,50,120,0.3);font-size:1.3rem;cursor:pointer;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;line-height:1}
.survey-close:hover{color:#e06070;background:rgba(220,90,100,0.1);transform:rotate(90deg)}
.survey-box iframe{display:block;border-radius:12px;width:100%;height:640px;border:none}
.survey-footer{text-align:center;padding:6px 0 10px;border-top:1px solid rgba(120,80,180,0.02);background:rgba(248,244,254,0.6)}
.survey-skip{background:none;border:none;color:rgba(80,50,120,0.2);font-size:0.75rem;cursor:pointer;transition:all 0.3s;padding:4px 16px;border-radius:20px;letter-spacing:1px}
.survey-skip:hover{color:rgba(80,50,120,0.4);background:rgba(240,236,248,0.6)}

/* ===== 响应式 ===== */
@media(max-width:820px),(max-height:600px){
  .topbar{padding:6px 10px}
  .main-body{flex-direction:column}
  .room-scene{padding:4px 6px}
  .side-panel{width:100%;min-width:unset;border-left:none;border-top:1px solid rgba(120,80,180,0.04);flex-direction:row;flex-wrap:wrap;padding:6px 8px;max-height:100px;flex-shrink:0}
  .side-panel h3{width:100%;margin-bottom:2px;font-size:0.62rem;border-bottom:none;padding-bottom:2px}
  .clue-list{flex-direction:row;overflow-x:auto;max-height:46px;flex:1;gap:4px}

  {id:1,title:'维多利亚书房',subtitle:'特殊元素优先法',bg:'bg1.jpg',npc:{av:'🧑‍🏫',name:'陈教授',tag:'被囚三年的倒霉蛋'},intro:['你睁开眼，发现自己站在一座古老的大殿门前。<br>石门缓缓打开，里面飘出<span class="hl-gold">羊皮纸</span>和<span class="hl-blue">星光</span>……','你是一个好奇心爆棚的探险家。今天，你本想去便利店买瓶水，<br>却意外踩中一块会发光的瓷砖——<span class="hl-red">"轰"</span>的一声，地板裂开，<br>你掉进了一座从未出现在任何地图上的古老圣殿。','圣殿大门在身后<span class="hl-red">"啪"</span>地关上，墙上浮现一行金字：<br><span class="hl-gold">『排列即命运。解开十一室，诅咒自破』</span>','<span class="hl-gold">"记住：NPC只聊天，不泄题。四个线索，一个密码。</span><br><span class="hl-gold">全部正确，圣殿大门就会打开。"</span>','"勇敢的冒险家，第一扇门就在眼前。<br><span class="hl-red">陈教授</span>等着你呢。"<br><br><span style="color:#6a8aaa;">（第一关 · 维多利亚书房 开启）</span>'],dlg:['嘘——小声点！这里的书会咬人。我是陈教授，被困在这间书房……<span class="hl">三年了</span>。你看那本《起源之书》，它脾气大得很，非要赖在最左边的位置，不然整个书架就会"轰"——。','这四张羊皮纸上写着线索，你帮我算算有多少种摆法……<span class="hl">快解谜！</span>','线索在<span class="hl">书架、壁炉、书桌、档案柜</span>里。','快输入吧，我已经三年没呼吸过外面的空气了……'],spots:[{id:'bookshelf',l:2,t:2,w:38,h:48,lb:'📚 古旧书架'},{id:'fireplace',l:4,t:54,w:28,h:36,lb:'🔥 壁炉灰烬'},{id:'desk',l:46,t:60,w:26,h:34,lb:'📝 红木书桌'},{id:'cabinet',l:74,t:52,w:12,h:34,lb:'🗄️ 档案柜'},{id:'chest',l:74,t:34,w:12,h:16,lb:'📦 密码箱'}],clues:{bookshelf:{ic:'📚',nm:'古籍记录',sh:'📚 一共6本古籍',bd:'羊皮纸（一）：<br><br>"书架上一共有 <span class="hl">6本不同的古籍</span>。"'},fireplace:{ic:'🔥',nm:'壁炉旁的纸条',sh:'🔥 《起源》必须最左边',bd:'羊皮纸（二）：<br><br>"《起源之书》必须放在 <span class="em">最左边（第1个位置）</span>。"'},desk:{ic:'📝',nm:'书桌上的演算纸',sh:'📝 其余5本任意排',bd:'羊皮纸（三）：<br><br>"《起源》固定后，<span class="hl">其余5本书可以任意排列</span>。"'},cabinet:{ic:'🗄️',nm:'档案柜的提示',sh:'🗄️ 5! =？',bd:'羊皮纸（四）：<br><br>"5本书排列有几种方式？<br><span class="em">这个数就是密码。</span>"'}},core:['bookshelf','fireplace','desk'],pin:'0120',max:4,vic:{ic:'🏆✨',ti:'✦ 第1关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">特殊元素优先法</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0120</strong>（5! = 120）<br><br>你帮陈教授逃离了维多利亚书房！<br><span style="color:#8aaacc;">⭐ 前往第2关 ⭐</span>'}},
  {id:2,title:'数学书籍区',subtitle:'相邻元素捆绑法',bg:'bg2.jpg',npc:{av:'🧙',name:'老馆员',tag:'典籍守护者'},intro:['穿过维多利亚书房的门洞，你走进一条狭长的走廊。<br>走廊尽头透出昏黄的灯光，弥漫着旧纸的墨香。','你推开门，发现四面墙壁全是书架，塞满了泛黄的数学典籍。<br>一个佝偻的身影从书架后探出头来。','他咧嘴一笑：<br>"哦，又有人掉进来了？我是老馆员，比陈教授还早来……<br>五年？六年？记不清了。除非……<br><span class="hl-gold">帮我算个排列数。</span>"','<span class="hl-gold">"《几何原本》和《算术研究》非得挨在一起放。<br>四张借书卡上有线索，自己去翻吧。"</span>','<span style="color:#6a8aaa;">（第二关 · 数学书籍区 开启）</span>'],dlg:['（老馆员从一堆书后探出头）<br>"哦！你是新来的？我是老馆员，比陈教授还早来……五年？六年？记不清了。"','"这里的《几何原本》和《算术研究》像一对冤家情侣，非得挨在一起——分开它们就会互相扔公式。"','"算出它们必须相邻的排列数。<span class="hl">四张借书卡上有提示。</span>"','"对了，别踩到地上的‘无穷大’符号，那是滑的。"'],spots:[{id:'bs2',l:34,t:8,w:48,h:50,lb:'📚 借书卡①'},{id:'lamp',l:26,t:37,w:7,h:24,lb:'🪔 借书卡②'},{id:'rdesk',l:16,t:56,w:67,h:42,lb:'📖 借书卡③'},{id:'scroll',l:37,t:58,w:24,h:14,lb:'📜 借书卡④'},{id:'chest',l:60,t:42,w:13,h:20,lb:'🔐 密码箱'}],clues:{bs2:{ic:'📚',nm:'借书卡①',sh:'📚 4本不同的数学著作',bd:'<span class="hl">借书卡①</span><br><br>书架上有4本不同的数学著作。'},lamp:{ic:'🪔',nm:'借书卡②',sh:'🪔 两本必须相邻',bd:'<span class="hl">借书卡②</span><br><br>《几何原本》和《算术研究》必须相邻。<br>组合块内部：<span class="em">2! = 2</span>'},rdesk:{ic:'📖',nm:'借书卡③',sh:'📖 另外两本随意放',bd:'<span class="hl">借书卡③</span><br><br>剩下2本书可以自由排列。'},scroll:{ic:'📜',nm:'借书卡④',sh:'📜 捆绑法',bd:'<span class="hl">借书卡④</span><br><br>捆成"组合块"后，共 <span class="em">3个元素</span>。排列数即密码。'}},core:['bs2','lamp','rdesk','scroll'],pin:'0012',max:4,vic:{ic:'🏆✨',ti:'✦ 第2关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">相邻元素捆绑法</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0012</strong><br><br>捆绑法：3! × 2! = 6 × 2 = <strong style="color:#8a5cc0;">12 → 0012</strong><br><br><span style="color:#8aaacc;">⭐ 前往第3关 ⭐</span>'}},
  {id:3,title:'星空观测台',subtitle:'不相邻排列 插空法',bg:'bg3.jpg',npc:{av:'🌟',name:'天文学家',tag:'观星老人'},intro:['推开数学书籍区的暗门，你沿着螺旋楼梯向上走了很久很久……<br>楼梯尽头是一扇圆形的铁门，上面刻着星座图案。','门后，是一个巨大的穹顶空间——<span class="hl-blue">星空观测台</span>。<br>一台古老的望远镜指向夜空，星图散落一地。','一个白发老人从望远镜前转过身来：<br>"来得正好！你看天上有颗<span class="hl-red">红星星</span>和<span class="hl-blue">蓝星星</span>——<br>它们一靠近就会下流星雨，准确说是砸到我头上。"','<span class="hl-gold">"三天前我睡了会，它们就差点亲上了，<br>我的天文台多了三个洞。现在你必须让它们永远不相邻。"</span>','"四块陨石碎片上有计算线索。<br>你要是算对了，我就请你喝热可可（其实只有冷水）。"<br><br><span style="color:#6a8aaa;">（第三关 · 星空观测台 开启）</span>'],dlg:['（天文学家举着望远镜，突然转身）<br>"来得正好！你看天上有颗<span class="hl">红星星</span>和<span class="hl">蓝星星</span>——它们一靠近就会下流星雨。现在你必须让它们永远不相邻。"','"四块陨石碎片上有计算线索。<br>你要是算对了，我就请你喝热可可。"','"有5颗不同颜色的星星要排成一行。<span class="hl">红和蓝绝对不能相邻</span>。其他3颗黄、绿、紫可以随便排。"','"先排好那3颗不受限的星星，会产生 <span class="hl">4个空位</span>。从这些空位中选2个放入红蓝星（顺序重要），再乘以前面3颗星的排列数，就是密码。"'],spots:[{id:'telescope',l:18,t:30,w:24,h:56,lb:'🔭 望远镜'},{id:'starchart',l:62,t:3,w:32,h:58,lb:'🌌 星图'},{id:'globe',l:46,t:39,w:12,h:32,lb:'🌠 天体仪'},{id:'journal',l:50,t:65,w:42,h:30,lb:'📜 陨石笔记'},{id:'chest',l:35,t:56,w:13,h:24,lb:'🔐 密码箱'}],clues:{telescope:{ic:'🔭',nm:'望远镜',sh:'🔭 5颗不同颜色的星星',bd:'望远镜镜片上刻着：<br>"<span class="hl">5颗颜色不同的星星</span>——<br>红、蓝、黄、绿、紫——排成一行。"'},starchart:{ic:'🌌',nm:'星图',sh:'🌌 红、蓝绝对不能相邻',bd:'星图上用朱砂笔圈着：<br>"<span class="hl">红色星和蓝色星</span><br>绝对不能相邻！否则会引发流星撞击。"'},globe:{ic:'🌠',nm:'天体仪',sh:'🌠 黄绿紫随意排列',bd:'天体仪底座刻着：<br>"其他 <span class="em">3颗星（黄、绿、紫）</span><br>可以任意排列，不受限制。"'},journal:{ic:'📜',nm:'陨石笔记',sh:'📜 3! × C(4,2) × 2! =？',bd:'笔记上详细写着：<br>"① 先排黄绿紫：<span class="hl">3! = 6</span> 种<br>② 产生 <span class="hl">4个空位</span>（_黄_绿_紫_）<br>③ 选2个空位放红蓝：<span class="hl">C(4,2) = 6</span><br>④ 红蓝顺序重要：<span class="hl">× 2! = 2</span><br>⑤ 密码 =？"'}},core:['telescope','starchart','globe'],pin:'0072',max:4,vic:{ic:'🏆✨',ti:'✦ 第3关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">不相邻排列 插空法</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0072</strong><br><br>3! × C(4,2) × 2! = 6 × 6 × 2 = <strong style="color:#8a5cc0;">72 → 0072</strong><br><br>红蓝星星再也不会相撞了！<br><span style="color:#8aaacc;">⭐ 前往第4关 ⭐</span>'}},
  {id:4,title:'钟楼工坊',subtitle:'定序问题',bg:'bg4.jpg',npc:{av:'🕰️',name:'钟表匠',tag:'发条守护者'},intro:['从星空观测台下来，你沿着螺旋楼梯继续往下走……<br>阶梯尽头传来"嘀嗒嘀嗒"的声响，忽远忽近。','你推开一扇沉重的木门，发现自己站在一间巨大的钟楼工坊里。<br>墙上挂满了各种钟表，从古老的摆钟到布谷鸟钟，应有尽有。','一个戴着厚厚眼镜的老人正埋头修理一个会唱歌的布谷鸟钟，<br>突然被鸟啄了一下——"哎哟！"他跳了起来。','<span class="hl-gold">"哦，你是新来的？我是这里的钟表匠。你要是能帮我解决这个排列问题，<br>我就告诉你下一扇门怎么开。"</span>','"齿轮、发条、摆轮必须按固定顺序出现，<br>否则钟声会变成《最炫民族风》——连续播了三天，我快疯了。"<br><br><span style="color:#6a8aaa;">（第四关 · 钟楼工坊 开启）</span>'],dlg:['（钟表匠正在修理一个会唱歌的布谷鸟钟，突然被鸟啄了一下）<br>"哎哟！这个破钟……啊，欢迎。我是钟表匠，在这座钟楼里修了三十年钟。"','"我这里的齿轮、发条、摆轮必须按 <span class="hl">齿轮→发条→摆轮</span> 的顺序出现，否则钟声会变成《最炫民族风》——连续播了三天，我快疯了。"','"你来帮忙算算：5个不同的零件，其中3个必须按固定顺序排列，总共有多少种排法？<span class="hl">四个零件盒里有线索。</span>"','"放心，不会让你碰那些钟——它们会咬人。"（指着自己手指上的创可贴）'],spots:[{id:'clock',l:3,t:1,w:32,h:70,lb:'🕰️ 零件盒①'},{id:'gears',l:58,t:2,w:34,h:42,lb:'⚙️ 零件盒②'},{id:'blueprint',l:52,t:46,w:44,h:46,lb:'📜 零件盒③'},{id:'key',l:18,t:68,w:36,h:28,lb:'🔑 零件盒④'},{id:'chest',l:36,t:32,w:18,h:36,lb:'🔐 密码柜'}],clues:{clock:{ic:'🕰️',nm:'零件盒①',sh:'🕰️ 5个不同的钟表零件',bd:'<span class="hl">零件盒①</span><br><br>一共有5个不同的钟表零件：<br>⚙️ 齿轮 · 🌀 发条 · ⏱️ 摆轮 · 👆 指针 · 🔵 表盘'},gears:{ic:'⚙️',nm:'零件盒②',sh:'⚙️ 三个必须按顺序',bd:'<span class="hl">零件盒②</span><br><br><span class="em">齿轮 → 发条 → 摆轮</span><br><br>这三个零件必须按照"齿轮→发条→摆轮"的先后顺序出现（不一定相邻）。<br>它们的相对顺序是固定的。'},blueprint:{ic:'📜',nm:'零件盒③',sh:'📜 指针表盘任意放',bd:'<span class="hl">零件盒③</span><br><br>另外两个零件（指针、表盘）可以任意放在剩余位置。<br>不受任何顺序限制。'},key:{ic:'🔑',nm:'零件盒④',sh:'🔑 5! / 3! =？',bd:'<span class="hl">零件盒④</span><br><br>不加限制时，5个不同零件有 <span class="em">5! = 120</span> 种排列。<br><br>但指定顺序的3个零件，在所有排列中，<br>它们的相对顺序只有 <span class="em">1/6 (1/3!)</span> 是符合要求的。<br>所以答案 = 120 ÷ 6 = <span class="em">20 → 0020</span>'}},core:['clock','gears','blueprint','key'],pin:'0020',max:4,vic:{ic:'🏆⚙️',ti:'✦ 第4关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">定序问题</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0020</strong><br><br>定序问题核心：5! / 3! = 120 / 6 = <strong style="color:#8a5cc0;">20 → 0020</strong><br><br>钟声终于恢复正常了！<br><span style="color:#8aaacc;">⭐ 前往第5关 ⭐</span>'}},
  {id:5,title:'烘焙厨房',subtitle:'隔板法（Stars and Bars）',bg:'bg5.jpg',npc:{av:'👨‍🍳',name:'面包师',tag:'第999炉面包'},intro:['走出钟楼，你顺着一条飘满麦香的走廊来到了一间烘焙厨房。<br>炉火正旺，面包的香气扑面而来。','一个围着围裙、脸上沾满面粉的老人正对着一排面包发愁。<br>他面前摆着三个篮子：木篮、竹篮、铁篮。','"你闻到了吗？这是第999炉面包……我烤了<span class="hl-gold">10个一模一样的面包</span>，<br>要分给三个篮子。每个篮子至少一个，不然铁篮会生气。"','"它真的会抖！你看——"（铁篮微微晃动）<br><span class="hl-gold">"四块饼干上有线索，你要是能算出分法，<br>我就告诉你密码柜的秘密配方。"</span>','<span style="color:#6a8aaa;">（第五关 · 烘焙厨房 开启）</span>'],dlg:['（面包师围着围裙，脸上沾满面粉）<br>"你闻到了吗？这是第999炉面包……我烤了<span class="hl">10个一模一样的面包</span>，要分给三个篮子——木篮、竹篮、铁篮。"','"每个篮子至少一个，不然铁篮会生气（它真的会抖）。我数学不好，分着分着就乱了。"','"这<span class="hl">四块饼干</span>上写着线索。算出来我分你一个面包，虽然有点硬。"','"对了，烤箱旁边那个密码柜里有我的秘密配方……你要是能算出来，顺便帮我打开它吧！"'],spots:[{id:'breadbasket',l:11.8,t:16.2,w:31.9,h:38.7,lb:'🍞 饼干①'},{id:'divider',l:62,t:7.5,w:38,h:54.9,lb:'📏 饼干②'},{id:'recipebook',l:49.2,t:58.2,w:28.1,h:38.2,lb:'📘 饼干③'},{id:'floursieve',l:8.3,t:72.6,w:19.8,h:27.3,lb:'🥄 饼干④'},{id:'chest',l:52,t:0,w:17.1,h:44.6,lb:'🔐 密码柜'}],clues:{breadbasket:{ic:'🍞',nm:'饼干①',sh:'🍞 10个完全相同的面包',bd:'<span class="hl">饼干①</span><br><br>面包师烤了<span class="em">10个完全相同的面包</span>。<br>完全相同，顺序无关紧要，只关心每个篮子分到几个。'},divider:{ic:'📏',nm:'饼干②',sh:'📏 分给3个不同的篮子',bd:'<span class="hl">饼干②</span><br><br>分给3个<span class="em">不同的篮子</span>：<br>🥬 <strong>木篮</strong>、🎋 <strong>竹篮</strong>、🔩 <strong>铁篮</strong>。<br>篮子不同，分法有区别。'},recipebook:{ic:'📘',nm:'饼干③',sh:'📘 每个篮子至少1个',bd:'<span class="hl">饼干③</span><br><br>每个篮子<span class="em">至少得到1个面包</span>。<br>铁篮会生气——它真的会抖！不能有空篮子。'},floursieve:{ic:'🥄',nm:'饼干④',sh:'🥄 提示：隔板法',bd:'<span class="hl">饼干④</span><br><br>10个面包排成一排，有<span class="em">9个空隙</span>。<br>插入<span class="em">2块隔板</span>（每个空隙最多插一块），分成三堆。<br><br>从9个空隙中选2个插入，有多少种选法？<br><span style="color:#8a5cc0;font-weight:bold;">那就是密码。</span>'}},core:['breadbasket','divider','recipebook','floursieve'],pin:'0036',max:4,vic:{ic:'🥖🏆',ti:'✦ 第5关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">隔板法（Stars and Bars）</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0036</strong><br><br>10个面包排一排，9个空隙选2个插隔板：<br>C(9, 2) = 9×8÷2 = <strong style="color:#8a5cc0;">36 → 0036</strong><br><br>铁篮再也不抖了！面包师送你一块（硬硬的）面包。<br><span style="color:#8aaacc;">⭐ 前往第6关 ⭐</span>'}},
  {id:6,title:'圆桌议事厅',subtitle:'环状排列',bg:'bg6.jpg',npc:{av:'⚔️',name:'圆桌骑士',tag:'奶茶采购官'},intro:['从烘焙厨房的后门出来，你走进一条挂满中世纪壁毯的走廊。<br>走廊尽头传来激烈的争吵声——<br>"你昨天坐了我的位置！""胡说，圆桌哪有你的位置？"','你推门而入，发现自己来到了一座宏伟的议事厅。<br>正中央是一张巨大的<span class="hl-gold">圆桌</span>，七位穿着不同颜色铠甲的骑士围坐一圈。','一位头盔歪了的骑士站起身：<br>"欢迎来到圆桌会议！我们七个骑士天天讨论谁去买奶茶，<br>但每次坐法都不一样，吵了三天都定不下来！"','<span class="hl-gold">"旋转后相同的坐法只算一种——<br>你帮我们算算总共有几种不同的坐法？<br>四件物品上有提示。"</span>','<span style="color:#6a8aaa;">（第六关 · 圆桌议事厅 开启）</span>'],dlg:['（骑士穿着盔甲，坐在圆桌旁，头盔歪了）<br>"欢迎来到……（打了个哈欠）圆桌会议。我们七个骑士天天围坐讨论谁去买奶茶，但每次坐法都不一样。"','"你知道吗？旋转后相同的坐法不算新姿势，否则吵三天都定不下来。"','"你帮我算算究竟有几种不同的坐法？<span class="hl">四件物品上有提示。</span>"','"算对了，我教你用单手开铁罐头。"<br><br><span style="color:#6a8aaa;">（线索藏在盾牌、骑士剑、银酒杯、羊皮卷中）</span>'],spots:[{id:'shield',l:1.5,t:1.5,w:17,h:42,lb:'🛡️ 盾牌徽章'},{id:'sword',l:84,t:7,w:14,h:86,lb:'⚔️ 骑士剑'},{id:'goblet',l:17,t:64,w:13,h:32,lb:'🥂 银酒杯'},{id:'scroll',l:41,t:41,w:32,h:18,lb:'📜 羊皮卷'},{id:'chest',l:63,t:68,w:28,h:32,lb:'🔐 密码箱'}],clues:{shield:{ic:'🛡️',nm:'盾牌徽章',sh:'🛡️ 7位不同的骑士',bd:'<span class="hl">盾牌徽章</span><br><br>有 <span class="em">7位不同的骑士</span> 围坐在一张圆桌旁。<br>每位骑士都穿着不同颜色的铠甲。'},sword:{ic:'⚔️',nm:'骑士剑',sh:'⚔️ 旋转重合算一种',bd:'<span class="hl">骑士剑</span><br><br>旋转后能重合的坐法 <span class="em">只算一种</span>。<br>（不区分顺时针和逆时针方向）'},goblet:{ic:'🥂',nm:'银酒杯',sh:'🥂 求不同坐法数目',bd:'<span class="hl">银酒杯</span><br><br>求所有不同的坐法数目。<br>这就是密码箱的答案！'},scroll:{ic:'📜',nm:'羊皮卷',sh:'📜 公式：(n-1)!',bd:'<span class="hl">羊皮卷</span><br><br>环状排列的公式是 <span class="em">(n-1)!</span><br>这里 n = 7，请计算 6 的阶乘。<br>6! = 6 × 5 × 4 × 3 × 2 × 1 = <span class="hl">720</span>'}},core:['shield','sword','goblet','scroll'],pin:'0720',max:4,vic:{ic:'🏆✨',ti:'✦ 第6关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">环状排列</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0720</strong><br><br>圆排列公式：(n-1)!<br>n = 7 → 6! = 6×5×4×3×2×1 = <strong style="color:#8a5cc0;">720 → 0720</strong><br><br>骑士们终于不再为座位吵架了！<br>你被授予"荣誉奶茶采购员"称号。<br><span style="color:#8aaacc;">⭐ 前往第7关 ⭐</span>'}},
  {id:7,title:'邮局',subtitle:'全错位排列',bg:'bg7.jpg',npc:{av:'📬',name:'崩溃邮差',tag:'错位8年'},intro:['推开圆桌议事厅的暗门，你走进一条昏暗的走廊。<br>走廊尽头挂着一块摇摇欲坠的木牌：<span class="hl-gold">『邮局』</span>。','你推门而入，发现满地都是散落的信封和信纸。<br>一个穿着旧制服的邮差正对着一堆信抓耳挠腮，表情崩溃。','他抬起头，眼睛红红的：<br>"完了完了！我又把信放错信封了……我在这邮局干了八年，<br><span class="hl-blue">每次都全放错——不是，我是说每次至少有一封是对的！</span>"','<span class="hl-gold">"4封不同的信，每封都不能放进自己的信封。<br>这才是真正的"全错位"！你帮我算算一共有几种全错的方式？</span>"','"墙上的<span class="hl-gold">三张邮票</span>和地上那个<span class="hl-gold">棕色布袋</span>上有线索……<br>求你了，我也想尝尝"全错"是什么滋味！"<br><br><span style="color:#6a8aaa;">（第七关 · 邮局 开启）</span>'],dlg:['（邮差抱着一堆信，一脸崩溃）<br>"完了完了！我又把信放错信封了……每次都要全放错，这是邮局的诅咒。"','"只有4封信，但<strong>全装错的方法数量</strong>就是密码。<br>我试了8年都没全错——每次都至少对一封。"','"你脑子比我好，墙上邮票和布袋上都有线索。<br>求你了，我也想尝尝<span class="hl">"全错"</span>是什么滋味。"','"密码就是那个数！快去翻翻看！"<br><br><span style="color:#6a8aaa;">（三张邮票 + 一个棕色布袋藏在房间里）</span>'],spots:[{id:'stamp1',l:2,t:3,w:32,h:42,lb:'🏷️ 邮票①'},{id:'stamp2',l:60,t:2,w:36,h:50,lb:'🏷️ 邮票②'},{id:'stamp3',l:2,t:50,w:30,h:26,lb:'🏷️ 邮票③'},{id:'stamp4',l:67,t:73,w:22,h:24,lb:'👜 棕色布袋'},{id:'chest',l:54,t:76,w:14,h:20,lb:'📦 盒子'}],clues:{stamp1:{ic:'🏷️',nm:'邮票①',sh:'🏷️ 4封不同的信',bd:'<span class="hl">邮票①</span><br><br>有<span class="em">4封不同的信</span>，分别对应4个不同信封。<br>信件A→信封A，信件B→信封B，<br>信件C→信封C，信件D→信封D。'},stamp2:{ic:'🏷️',nm:'邮票②',sh:'🏷️ 每封不能装错',bd:'<span class="hl">邮票②</span><br><br>每封信都不能放进它自己的信封。<br>即：A不能进A，B不能进B，<br>C不能进C，D不能进D。<br><span class="em">这就是全错位排列！</span>'},stamp3:{ic:'🏷️',nm:'邮票③',sh:'🏷️ 求总数',bd:'<span class="hl">邮票③</span><br><br>求所有可能的错位排列总数。<br>也就是：4封信全部放错的情况有几种？'},stamp4:{ic:'👜',nm:'棕色布袋',sh:'👜 递推公式',bd:'<span class="hl">棕色布袋</span><br><br>布袋上绣着一段公式：<br>错位排列数列：<br>D₁ = 0，D₂ = 1，D₃ = 2<br><br>递推公式（欧拉证明）：<br><span class="em">Dₙ = (n−1) × (Dₙ₋₁ + Dₙ₋₂)</span><br><br>代入 n=4 → D₄ = 3 × (2+1) = <span class="hl">9</span>'}},core:['stamp1','stamp2','stamp3','stamp4'],pin:'0009',max:4,vic:{ic:'✉️🏆',ti:'✦ 第7关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">全错位排列</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0009</strong><br><br>错位排列递推公式：<br>D₁ = 0，D₂ = 1，D₃ = 2<br>D₄ = (4−1) × (D₃ + D₂) = 3 × (2+1) = <strong style="color:#8a5cc0;">9 → 0009</strong><br><br>邮差终于尝到了"全错"的滋味！<br><span style="color:#8aaacc;">⭐ 前往第8关 ⭐</span>'}},
  {id:8,title:'体育场',subtitle:'平均分组再分配',bg:'bg8.jpg',npc:{av:'🏃',name:'教练',tag:'吹哨人'},intro:['从邮局的后门出来，你听到远处传来哨声和欢呼声。<br>你循声走去，发现自己来到了一座巨大的体育场。','穿过空荡荡的观众席，你推开教练室的门。<br>一个穿着运动外套、脖子上挂哨子的中年人正对着战术板发呆。','他转过身来：<br>"集合！6个队员分成3组每组2人，<br>派去篮球、足球、排球三个不同的项目。"','<span class="hl-gold">"分组不分先后，但项目有区别。<br>你先帮我算算有多少种分配方式？<br>四块战术板上有线索。"</span>','"别问为什么教练要算数学——我当年数学不及格。😅"<br><br><span style="color:#6a8aaa;">（第八关 · 体育场 · 教练室 开启）</span>'],dlg:['🏃（教练吹哨）<br>"集合！6个队员分成3组每组2人，派去篮球、足球、排球。分组不分先后，项目不同。算出来让你当一日队长。"','"这四块战术板上有条件。别问为什么队长要算数学——我当年数学不及格。" 😅','"<span class="hl">先算分组数</span>：从6人选2人成第一组，再从剩下4人选2人成第二组，最后2人成第三组。组无标号除以3!！"','"<span class="hl">再把3组分配给3个项目</span>，有3!种。两者相乘就是密码！<br>右边 <span class="hl">密码箱</span>就是钥匙！快去算！"'],spots:[{id:'tacticalboard',l:40,t:8,w:42,h:55,lb:'📋 战术板①'},{id:'jerseys',l:1,t:12,w:32,h:68,lb:'👕 球衣②'},{id:'football',l:68,t:74,w:16,h:18,lb:'⚽ 足球③'},{id:'trophy',l:78,t:8,w:12,h:16,lb:'🏆 奖杯④'},{id:'chest',l:76,t:35,w:16,h:26,lb:'🔐 更衣柜'}],clues:{tacticalboard:{ic:'📋',nm:'战术板①',sh:'📋 6名不同队员',bd:'<span class="hl">战术板①</span><br><br>教练手上有 <span class="em">6名不同的队员</span>，分成3组每组2人，参加三个不同项目：篮球、足球、排球。'},jerseys:{ic:'👕',nm:'球衣②',sh:'👕 先无标号分组',bd:'<span class="hl">球衣②</span><br><br>先把6名队员分成3个 <span class="em">无标号的小组</span>（组之间无先后顺序，甲+乙和乙+甲视为同一组）。'},football:{ic:'⚽',nm:'足球③',sh:'⚽ 再分配项目',bd:'<span class="hl">足球③</span><br><br>分好3个小组后，将3个小组分配到 <span class="em">三个不同的项目</span>（篮球、足球、排球）。不同分配顺序产生不同结果。'},trophy:{ic:'🏆',nm:'奖杯④',sh:'🏆 分组×分配',bd:'<span class="hl">奖杯④</span><br><br><span class="em">步骤一</span>：分组数 = C(6,2)×C(4,2)×C(2,2)÷3! = 15×6×1÷6 = <span class="hl">15</span><br><br><span class="em">步骤二</span>：分配项目数 = 3! = <span class="hl">6</span><br><br>密码 = 15 × 6 = <span class="hl">90</span> → <span class="em">0090</span>'}},core:['tacticalboard','jerseys','football','trophy'],pin:'0090',max:4,vic:{ic:'🏆⚽',ti:'✦ 第8关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">平均分组再分配</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0090</strong><br><br>① 分组：C(6,2)×C(4,2)×C(2,2)÷3! = <strong>15</strong><br>② 分配：3! = <strong>6</strong><br>③ 总数：15 × 6 = <strong style="color:#8a5cc0;">90 → 0090</strong><br><br>教练吹响了通关哨！<br><span style="color:#8aaacc;">⭐ 前往第9关 ⭐</span>'}},
  {id:9,title:'画室工作室',subtitle:'环形涂色公式',bg:'bg9.jpg',npc:{av:'👨‍🎨',name:'老画家',tag:'环形涂色'},intro:['走出体育场的更衣室，你顺着一条充满艺术气息的走廊前进。<br>空气中弥漫着颜料和松节油的味道……','你推开门，发现自己站在一间宽敞明亮的画室里。<br>墙上挂满了色彩斑斓的画作，地上散落着各种画笔和色卡。','一位戴着贝雷帽的老画家从画架后探出头来，画笔还夹在耳朵上。<br>"来得正好！你看这个环形图案——4个区域首尾相连，<br>我有5管颜料，相邻不能同色，帮我算算有多少种涂法？"','<span class="hl-gold">"环形涂色有公式！四处线索藏在画室里。</span><br><span class="hl-gold">环形画作、色卡、规则手稿和公式卷轴上。"</span>','<span style="color:#6a8aaa;">（第九关 · 画室工作室 开启）</span>'],dlg:['（画家浑身颜料，正在画一个环形图案）<br>"你看这个环形图案，有4个区域首尾相连。我有5管颜料——红黄蓝绿紫，每个区域涂一种，相邻不能同色。我涂了73遍都重样了！你帮我算算有多少种涂法？"','"规则很简单：相邻区域（包括第4和第1区域）颜色必须不同，但颜色可以重复使用，只要相邻不同就行。"','"四处藏着线索提示——<span class="hl">环形画作、色卡、规则手稿、公式卷轴</span>。凑齐了就能算出来！"','"对了，小心点别碰倒我的颜料盘……"<br><br><span style="color:#6a8aaa;">（四处线索分别藏在：🔄环形画作、🎨色卡、📝规则手稿、📜公式卷轴中）</span>'],spots:[{id:'abstract',l:65,t:12,w:10,h:22,lb:'🔄 环形画作'},{id:'colorcard',l:22,t:86,w:22,h:12,lb:'🎨 色卡'},{id:'palette',l:42,t:46,w:12,h:10,lb:'📝 规则手稿'},{id:'paintbrush',l:78,t:62,w:14,h:16,lb:'📜 公式卷轴'},{id:'chest',l:16,t:60,w:20,h:22,lb:'🔐 密码箱'}],clues:{abstract:{ic:'🔄',nm:'环形画作',sh:'🔄 n=4个环形区域',bd:'<span class="hl">环形画作上的标注</span><br><br>画布上画着一个大圆环，被均分为 <span class="em">4</span> 个扇形区域。<br>边缘写着小字："首尾相连，相邻不同色。"<br><br>提示：<span class="hl">n = 4</span>'},colorcard:{ic:'🎨',nm:'色卡',sh:'🎨 m=5种颜色',bd:'<span class="hl">色卡上的标记</span><br><br>一张褪色的色卡，上面排列着 <span class="em">5</span> 种颜色：<br>🔴红 🟡黄 🔵蓝 🟢绿 🟣紫<br><br>提示：<span class="hl">m = 5</span>'},palette:{ic:'📝',nm:'规则手稿',sh:'📝 相邻不同 & 可重复',bd:'<span class="hl">桌上的规则手稿</span><br><br>「环形涂色规则」<br>1. 每个区域涂一种颜色<br>2. 相邻区域（含首尾）颜色<span class="em">必须不同</span><br>3. 颜色可以<span class="em">重复使用</span>，只要相邻不同即可'},paintbrush:{ic:'📜',nm:'公式卷轴',sh:'📜 环形涂色公式',bd:'<span class="hl">卷轴上的公式</span><br><br>展开的羊皮卷上写着一行公式：<br><br><span class="hl">(m−1)ⁿ + (−1)ⁿ·(m−1)</span><br><br>下面有一行小字：<br>"先算4的4次方，再加一个什么数？得数就是密码。"<br><br>代入 m=5, n=4：<br>4⁴ + (−1)⁴·4 = 256 + 4 = <span class="hl">260</span>'}},core:['abstract','colorcard','palette','paintbrush'],pin:'0260',max:4,vic:{ic:'🎨🏆',ti:'✦ 第9关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">环形涂色公式</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0260</strong><br><br>环形涂色公式：(m−1)ⁿ + (−1)ⁿ·(m−1)<br>代入 m=5, n=4：<br><span class="hl">4⁴ + 4 = 256 + 4 = 260 → 0260</span><br><br>老画家终于不用再担心颜色重复了！<br><span style="color:#8aaacc;">⭐ 前往第10关 ⭐</span>'}},
  {id:10,title:'迷宫花园',subtitle:'组合路径',bg:'bg10.jpg',npc:{av:'🧭',name:'探险家',tag:'迷宫旅人'},intro:['走出画室的后门，你沿着一条布满藤蔓的走廊前行。<br>空气中弥漫着泥土和花香，远处传来流水声……','你推开一扇锈迹斑斑的铁门，眼前豁然开朗——<br>一座巨大的<span class="hl-blue">迷宫花园</span>出现在你面前。<br>绿篱修剪得整整齐齐，蜿蜒的小径通向深处。','一个背着背包的探险家蹲在路口，正用指南针反复比划。<br>他抬起头，眼睛一亮：<br>"你来得正好！我在这迷宫走了三年——<br>从 <span class="hl-gold">左下角走到右上角</span>，只能向右或向上……"','<span class="hl-gold">"我数过了，总是5步向右、3步向上。<br>但到底有多少条不同的路径？你帮我算算！<br>四片刻字树叶上写着线索。"</span>','<span style="color:#6a8aaa;">（第十关 · 迷宫花园 开启）</span>'],dlg:['（探险家拿着地图，一脸迷茫）<br>"我在这迷宫走了三年……从左边下角走到右上一角，只能向右或向上。"','"走了无数次，发现总是 <span class="hl">5步向右、3步向上</span>。但路径数量多到吓人。"','"你帮我算算到底有多少条不同路径？<span class="hl">四片树叶上刻着线索，一步步引导你。</span>"<br><br><span style="color:#6a8aaa;">（树叶藏在🧭指南针、📜地图、👞靴子、🌹玫瑰处）</span>','"每片树叶都像一个提示，按顺序看下来你就能自己算出答案。别踩那些移动的篱笆！"'],spots:[{id:'compass',l:18,t:85,w:10,h:9,lb:'🧭 树叶①'},{id:'map',l:41,t:48,w:11,h:8,lb:'📜 树叶②'},{id:'boots',l:76,t:79,w:9,h:7,lb:'👞 树叶③'},{id:'rose',l:20,t:8,w:18,h:15,lb:'🌹 树叶④'},{id:'chest',l:54,t:51,w:8,h:7,lb:'🔐 密码箱'}],clues:{compass:{ic:'🧭',nm:'树叶①',sh:'🧭 向右5步，向上3步',bd:'<span class="hl">树叶① · 先看清问题</span><br><br>从迷宫左下角走到右上角，探险家发现：<br>• 需要向右走 <span class="em">5 步</span><br>• 需要向上走 <span class="em">3 步</span><br><br>🤔 想一想：<span style="color:#5080b0;">要到达终点，一共要走多少步呢？</span>'},map:{ic:'📜',nm:'树叶②',sh:'📜 只能向右或向上',bd:'<span class="hl">树叶② · 理解限制条件</span><br><br>迷宫里的篱笆是单向的——<br>每一步只能 <span class="em">向右</span> 或 <span class="em">向上</span>，<br>不能向左，也不能向下走回头路。<br><br>🧠 <span style="color:#5080b0;">一共要走5+3=8步，每一步只有两种可能——"右"或"上"。</span>'},boots:{ic:'👞',nm:'树叶③',sh:'👞 8步中选3步向上',bd:'<span class="hl">树叶③ · 换个角度看问题</span><br><br>一共 <span class="em">8 步</span>，其中 <span class="em">5步向右</span>、<span class="em">3步向上</span>。<br><br>💡 把这8步看作8个排好的空位：<br><span style="font-size:1.2rem;letter-spacing:6px;">_ _ _ _ _ _ _ _</span><br><br>只要决定哪 <span class="em">3个位置</span> 放"向上"的步，<br>剩下的就是"向右"的步。<br><br>🤔 从8个位置中选出3个来放"上"，有多少种选法？'},rose:{ic:'🌹',nm:'树叶④',sh:'🌹 代入C(n,k)自己算',bd:'<span class="hl">树叶④ · 用组合公式自己算！</span><br><br>从 <span class="em">8个位置</span> 中选 <span class="em">3个</span>，<br>这就是组合数 <span class="hl">C(8,3)</span>！<br><br><div style="background:#f5f0ff;border-radius:12px;padding:12px 16px;margin:10px 0;border:1px solid #c0b0d8;text-align:center;font-size:1.1rem;color:#3a2860;font-family:monospace;">C(n,k) = n! / (k! × (n−k)!)</div><div style="background:#f8f4fe;border-left:3px solid #d4a84a;padding:8px 12px;margin:8px 0;border-radius:0 8px 8px 0;color:#3a2860;font-size:0.85rem;">📝 n=8, k=3<br>C(8,3) = 8! / (3! × 5!)<br><br>✏️ <span style="color:#8a5cc0;">展开计算，算出来的结果就是密码箱的密码。</span><br><span style="color:#7a9a6a;">（四位数字，不够前面补0）</span></div>'}},core:['compass','map','boots','rose'],pin:'0056',max:4,vic:{ic:'🏆✨',ti:'✦ 第10关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">组合路径</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0056</strong><br><br>一共要走 5 + 3 = <strong>8步</strong>，<br>从8个位置中选3个放"向上"：<br>C(8,3) = 8! / (3! × 5!) = 8×7×6 / 3×2×1 = <strong style="color:#8a5cc0;">56 → 0056</strong><br><br>探险家终于走出了迷宫花园！<br><span style="color:#8aaacc;">⭐ 前往第11关 ⭐</span>'}},
  {id:11,title:'符文密室',subtitle:'相同元素排列',bg:'bg11.jpg',npc:{av:'🧙',name:'占星师',tag:'悬浮的预言者'},intro:['走出迷宫花园，你顺着一条盘旋向下的石阶走了很久很久……<br>石阶尽头弥漫着淡紫色的雾气，空气中传来低沉的嗡鸣声。','你推开一扇刻满符文的石门，发现自己站在一间幽暗的密室中。<br>墙壁上镶嵌着发光的符文，天花板上悬浮着一颗巨大的水晶球。','一个披着星袍的身影悬浮在水晶球前，转过身来：<br>"第十一室，也是最后一室。我是占星师，<br>在这里守护了整整一百年——等你来解开最后的谜题。"','<span class="hl-gold">"这里有2个相同的太阳符文和3个不同的星星符文：<br>金星、火星、木星。把它们排成一排，<br>所有不同的排列数，就是圣殿大门的最终密码。"</span>','"成功之后，大门会打开，你会看到久违的阳光。<br><span style="color:#6a8aaa;">（第十一关 · 符文密室 开启）</span>'],dlg:['（占星师悬浮在空中，周围漂浮着符文，声音空灵而深远）<br>"终点了！我是占星师。这里有2个相同的太阳符文和3个不同的星星符文——金星、火星、木星。"','"把它们排成一排，所有不同的排列数就是圣殿大门的密码。<span class="hl">我占卜了100年都没排完……</span>"','"这四块符文石上写着最后的提示。集齐它们，答案就会浮现。"','"成功之后，门会打开，你会看到阳光。快去，我也该下班了。"<br><br><span style="color:#8a8aaa;">（四块符文石藏在🔮水晶球、🪨左侧架、📖占星卷轴和✨星盘之中）</span>'],spots:[{id:'crystal',l:46,t:36,w:14,h:18,lb:'🔮 符文石①'},{id:'rune',l:0,t:8,w:17,h:55,lb:'🪨 符文石②'},{id:'scroll11',l:14,t:35,w:15,h:30,lb:'📖 符文石③'},{id:'astro',l:3,t:72,w:15,h:24,lb:'✨ 符文石④'},{id:'chest',l:83,t:5,w:18,h:17,lb:'🔐 密码箱'}],clues:{crystal:{ic:'🔮',nm:'符文石①',sh:'🔮 一共5个符文',bd:'<span class="hl">符文石①</span><br><br>一共 <span class="em">5个符文</span> 需要排成一排。<br>它们要组成某种神秘的序列，用来打开圣殿大门。'},rune:{ic:'🪨',nm:'符文石②',sh:'🪨 2个相同，3个不同',bd:'<span class="hl">符文石②</span><br><br>这5个符文中：<br>· <span class="em">2个太阳符文</span> —— 完全相同<br>· <span class="em">3个星星符文</span> —— 金星、火星、木星，互不相同'},scroll11:{ic:'📖',nm:'符文石③',sh:'📖 求排列总数',bd:'<span class="hl">符文石③</span><br><br>求所有不同的排列方式总数。<br>答案就是开启圣殿大门的 <span class="hl">四位密码</span>。'},astro:{ic:'✨',nm:'符文石④',sh:'✨ 除以2!',bd:'<span class="hl">符文石④</span><br><br>如果没有相同元素，5个不同符文的排列数是 <span class="em">5!</span>。<br>但因为 <span class="em">2个太阳符文相同</span>，需要除以它们内部的顺序数 <span class="hl">2!</span>。<br>→ 总排列 = <span class="em">5! ÷ 2!</span>'}},core:['crystal','rune','scroll11','astro'],pin:'0060',max:4,vic:{ic:'🏆✨',ti:'✦ 第11关 · 通关 ✦',bd:'<strong style="color:#8a5cc0;">相同元素排列</strong> 掌握！<br><br>密码 <strong style="color:#2ecc71;">0060</strong><br><br>5个符文排列，其中2个相同（太阳符文），3个不同（金星、火星、木星）<br>全排列数 = 5! ÷ 2! = 120 ÷ 2 = <strong style="color:#8a5cc0;">60 → 0060</strong><br><br>✨ 圣殿大门轰然打开，久违的阳光洒了进来！<br><br><span style="color:#f1c40f;font-size:1.1rem;">🎉 恭喜你解开了排列圣殿的全部谜题！ 🎉</span>'}}
];

// ===== 游戏状态 =====
const S={lv:0,col:[],chest:false,won:false,pend:null,di:0,timer:null,typing:false,pin:'',ii:0,iTimer:null,iTyping:false,started:false,ambient:false,bgAspect:0};
const $=id=>document.getElementById(id);
const LV=()=>LEVELS[S.lv];

// ===== 图片背景加载 =====
function loadBg(url,cb){
  var img=new Image();
  img.onload=function(){S.bgAspect=img.naturalWidth/img.naturalHeight;if(cb)cb()};
  img.onerror=function(){S.bgAspect=1.5;if(cb)cb()};
  img.src=url;
}

// ===== 热点位置计算 =====
function rep(){
  var c=$('roomInterior'),cw=c.clientWidth,ch=c.clientHeight;
  if(!cw||!ch||!S.bgAspect){requestAnimationFrame(rep);return}
  var ca=cw/ch,dw,dh,ox=0,oy=0;
  if(ca>S.bgAspect){dh=ch;dw=ch*S.bgAspect;ox=(cw-dw)/2}
  else{dw=cw;dh=cw/S.bgAspect;oy=(ch-dh)/2}
  document.querySelectorAll('.hotspot').forEach(function(h){
    var l=parseFloat(h.dataset.l)||0,t=parseFloat(h.dataset.t)||0,w=parseFloat(h.dataset.w)||10,ht=parseFloat(h.dataset.h)||10;
    var rl=ox+(l/100)*dw,rt=oy+(t/100)*dh,rw=(w/100)*dw,rh=(ht/100)*dh;
    h.style.left=((rl/cw)*100)+'%';h.style.top=((rt/ch)*100)+'%';
    h.style.width=((rw/cw)*100)+'%';h.style.height=((rh/ch)*100)+'%';
  });
}

// ===== 渲染关卡 =====
function renderLevel(){
  var lv=LV();if(!lv)return;
  if(S.timer){clearTimeout(S.timer);S.timer=null}
  S.col=[];S.chest=false;S.won=false;S.pend=null;S.di=0;S.pin='';S.ambient=false;
  $('lvBadge').textContent='第'+lv.id+'关';
  $('roomTitle').innerHTML='🕯️ 第'+lv.id+'关 · '+lv.title+' · '+lv.subtitle;
  $('roomInterior').style.backgroundImage="url('"+lv.bg+"')";
  var ri=$('roomInterior');
  ri.querySelectorAll('.hotspot').forEach(function(el){el.remove()});
  lv.spots.forEach(function(h){
    var div=document.createElement('div');div.className='hotspot';
    div.dataset.id=h.id;div.dataset.l=h.l;div.dataset.t=h.t;div.dataset.w=h.w;div.dataset.h=h.h;
    div.innerHTML='<span class="hot-label">'+h.lb+'</span>';
    div.addEventListener('click',function(ev){ev.stopPropagation();oc(h.id)});
    ri.insertBefore(div,$('npcDlg'));
  });
  $('npcAvatar').textContent=lv.npc.av;
  $('npcName').innerHTML=lv.npc.name+' <span>· '+lv.npc.tag+'</span>';
  $('npcDlg').classList.add('hidden');
  $('clueCount').textContent='0/'+lv.max;
  $('progFill').style.width='0%';
  $('clueList').innerHTML='<div class="clue-empty">🔍 点击物品寻找线索</div>';
  $('victoryScreen').classList.remove('active');
  $('clueModal').classList.remove('active');
  $('pinModal').classList.remove('active');
  $('footerMsg').innerHTML='🏰 第'+lv.id+'关：帮助'+lv.npc.name+'解谜！';
  loadBg(lv.bg,function(){rep()});
  startIntro();
}

// ===== 开场介绍 =====
function startIntro(){
  var lv=LV();$('introOverlay').classList.remove('hidden');
  $('introSubtitle').textContent='— 第'+lv.id+'关 · '+lv.title+' —';
  $('introNarratorWrap').textContent='◆ 第'+lv.id+'关 · '+lv.title+' ◆';
  S.ii=0;S.iTyping=false;S.started=false;showI(0);
}
function showI(idx){
  var lv=LV(),lines=lv.intro;
  if(!S.ambient){S.ambient=true;pt(220,1.2);setTimeout(()=>pt(330,0.8),300);setTimeout(()=>pt(280,1),600)}
  if(idx>=lines.length){$('introContent').innerHTML='<span style="color:#6a8aaa;">◆ 点击进入密室 ◆</span>';$('introHint').textContent='▶ 点击开始';S.iTyping=false;return}
  var el=$('introContent');el.innerHTML='';S.iTyping=true;$('introHint').style.display='none';
  var p=0,str=lines[idx];
  function ti(){
    if(p<str.length){el.innerHTML=str.substring(0,p+1);p++;if(p>=str.length){S.iTyping=false;$('introHint').style.display='block';$('introHint').textContent=S.ii<lines.length-1?'▼ 点击继续':'▶ 点击开始';S.iTimer=null;return}S.iTimer=setTimeout(ti,20+Math.random()*30)}
    else{S.iTyping=false;$('introHint').style.display='block';$('introHint').textContent=S.ii<lines.length-1?'▼ 点击继续':'▶ 点击开始';S.iTimer=null}
  }
  S.iTimer=setTimeout(ti,400);
}
function nextI(){
  var lv=LV();sc();
  if(S.iTyping){if(S.iTimer){clearTimeout(S.iTimer);S.iTimer=null}S.iTyping=false;$('introContent').innerHTML=lv.intro[S.ii];$('introHint').style.display='block';$('introHint').textContent=S.ii<lv.intro.length-1?'▼ 点击继续':'▶ 点击开始';return}
  if(S.ii>=lv.intro.length){$('introOverlay').classList.add('hidden');S.started=true;sg()}
  else{S.ii++;showI(S.ii)}
}
function sg(){$('npcDlg').classList.remove('hidden');$('npcBubble').classList.add('visible');S.di=0;sd(0)}

// ===== NPC对话 =====
function sd(idx){
  var lv=LV(),d=lv.dlg;if(idx>=d.length){$('npcDlg').classList.add('hidden');$('footerMsg').innerHTML='🔍 自由探索！';return}
  if(S.timer){clearTimeout(S.timer);S.timer=null}
  var el=$('npcText');el.innerHTML='';S.typing=true;$('npcHint').style.display='none';
  var p=0,str=d[idx];
  function ti(){
    if(p<str.length){el.innerHTML=str.substring(0,p+1);p++;if(p>=str.length){S.typing=false;$('npcHint').style.display='block';S.timer=null;return}S.timer=setTimeout(ti,18+Math.random()*25)}
    else{S.typing=false;$('npcHint').style.display='block';S.timer=null}
  }
  S.timer=setTimeout(ti,280);
}
function nd(){if(S.won)return;sc();if(S.typing){if(S.timer){clearTimeout(S.timer);S.timer=null}S.typing=false;$('npcText').innerHTML=LV().dlg[S.di];$('npcHint').style.display='block';return}S.di++;sd(S.di)}

// ===== 线索系统 =====
function uu(){
  var lv=LV(),n=S.col.length;
  $('clueCount').textContent=n+'/'+lv.max;
  $('progFill').style.width=(n/lv.max*100)+'%';
  var lst=$('clueList');if(!n){lst.innerHTML='<div class="clue-empty">🔍 点击物品寻找线索</div>';return}
  var h='';S.col.forEach(function(id){var c=lv.clues[id];if(c)h+='<div class="clue-card"><span class="emoji">'+c.ic+'</span> '+c.sh+'</div>'});
  if(lv.core.every(c=>S.col.indexOf(c)>=0)&&!S.chest&&!S.won)h+='<div class="clue-card special">🧠 推理完成！去输密码！</div>';
  lst.innerHTML=h||'<div class="clue-empty">✨ 线索浮现中...</div>';
}
function oc(id){
  var lv=LV();if(S.won){$('footerMsg').innerHTML='🎉 已通关！';return}
  if(id==='chest'){
    if(S.chest){$('footerMsg').innerHTML='🗃️ 已打开！';return}
    if(!lv.core.every(r=>S.col.indexOf(r)>=0)){sl();$('footerMsg').innerHTML='🔒 还需收集全部线索！';return}
    sc();S.pin='';$('pinDisplay').textContent='____';$('pinSubTitle').textContent='四位数字密码';$('pinModal').classList.add('active');return
  }
  if(S.col.indexOf(id)>=0){$('footerMsg').innerHTML='📌 已查看。';return}
  var c=lv.clues[id];if(c){sc();S.pend=id;$('clueIcon').textContent=c.ic;$('clueTitle').textContent=c.nm;$('clueBody').innerHTML=c.bd;$('clueModal').classList.add('active')}
}
function cc(){var id=S.pend;if(!id||S.col.indexOf(id)>=0){$('clueModal').classList.remove('active');return}S.col.push(id);$('clueModal').classList.remove('active');sco();var hs=document.querySelector('.hotspot[data-id="'+id+'"]');if(hs)hs.classList.add('collected');uu();$('footerMsg').innerHTML='✅ 获得线索 ('+S.col.length+'/'+LV().max+')';S.pend=null}
function cx(){$('clueModal').classList.remove('active');S.pend=null}

// ===== 密码系统 =====
function pi(k){if(k==='clear')S.pin='';else if(k==='back')S.pin=S.pin.slice(0,-1);else if(S.pin.length<4){S.pin+=k;sk()}$('pinDisplay').textContent=S.pin.padEnd(4,'_')}
function cp(){
  var lv=LV();if(S.pin.length!==4){$('footerMsg').innerHTML='⚠️ 必须4位！';return}
  if(S.pin===lv.pin){
    S.chest=true;S.won=true;$('pinModal').classList.remove('active');sco();
    var hs=document.querySelector('.hotspot[data-id="chest"]');if(hs)hs.classList.add('collected');uu();sv();
    $('vicIcon').textContent=lv.vic.ic;$('vicTitle').textContent=lv.vic.ti;$('vicBody').innerHTML=lv.vic.bd;
    var nxt=S.lv<LEVELS.length-1;$('vicNextBtn').style.display=nxt?'inline-block':'none';
    if(nxt)$('vicNextBtn').onclick=function(){$('victoryScreen').classList.remove('active');S.lv++;renderLevel()};
    $('footerMsg').innerHTML='🎉 通关！';
    setTimeout(function(){$('victoryScreen').classList.add('active')},500);
    if(S.lv===LEVELS.length-1){
      setTimeout(function(){
        if(typeof window.showSurvey === 'function') window.showSurvey();
      }, 1200);
    }
  } else {
    se();$('footerMsg').innerHTML='❌ 密码错误！';S.pin='';$('pinDisplay').textContent='____';
    var b=document.querySelector('.pin-box');
    if(b){b.style.animation='none';b.offsetHeight;b.style.animation='shake 0.35s ease';setTimeout(function(){b.style.animation=''},400)}
  }
}
function rs(){
  if(S.timer)clearTimeout(S.timer);if(S.iTimer){clearTimeout(S.iTimer);S.iTimer=null}
  S.col=[];S.chest=false;S.won=false;S.pend=null;S.di=0;S.typing=false;S.pin='';S.iTyping=false;S.ambient=false;
  $('clueModal').classList.remove('active');$('pinModal').classList.remove('active');
  $('victoryScreen').classList.remove('active');document.querySelectorAll('.hotspot').forEach(e=>e.classList.remove('collected'));
  $('roomInterior').style.backgroundImage='none';renderLevel();
}

// ===== 问卷星弹窗控制 =====
(function(){
  'use strict';
  const overlay=document.getElementById('surveyOverlay');
  const closeBtn=document.getElementById('surveyClose');
  const skipBtn=document.getElementById('surveySkip');
  let shown=false;
  
  window.showSurvey=function(){
    if(shown)return;shown=true;
    overlay.classList.add('active');
    document.body.style.overflow='hidden';
    setTimeout(function(){
      var wrap=document.querySelector('.survey-box');
      if(wrap)wrap.style.maxHeight=Math.min(window.innerHeight*0.9,820)+'px';
    },100);
  };
  
  function hideSurvey(){
    overlay.classList.remove('active');
    document.body.style.overflow='';
  }
  
  closeBtn.addEventListener('click',hideSurvey);
  if(skipBtn)skipBtn.addEventListener('click',hideSurvey);
  overlay.addEventListener('click',function(e){if(e.target===overlay)hideSurvey()});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&overlay.classList.contains('active'))hideSurvey();
  });
  window.addEventListener('resize',function(){
    if(overlay.classList.contains('active')){
      var wrap=document.querySelector('.survey-box');
      if(wrap)wrap.style.maxHeight=Math.min(window.innerHeight*0.9,820)+'px';
    }
  });
  console.log('📋 问卷星已加载（第11关通关后自动弹出）');
})();

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded',function(){
  $('introOverlay').addEventListener('click',nextI);
  $('npcBubble').addEventListener('click',nd);
  $('resetBtn').addEventListener('click',rs);
  $('vicReplayBtn').addEventListener('click',rs);
  $('collectClueBtn').addEventListener('click',cc);
  $('closeModalBtn').addEventListener('click',cx);
  $('pinCancelBtn').addEventListener('click',function(){$('pinModal').classList.remove('active')});
  $('pinConfirmBtn').addEventListener('click',cp);
  document.querySelectorAll('#pinPad button').forEach(function(btn){
    btn.addEventListener('click',function(){
      var n=btn.getAttribute('data-num'),f=btn.getAttribute('data-fn');
      if(n!==null)pi(n);else if(f==='clear')pi('clear');else if(f==='back')pi('back');
    });
  });
  document.addEventListener('keydown',function(e){
    if(!document.getElementById('introOverlay').classList.contains('hidden')){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();nextI()}return
    }
    if(document.querySelector('.pin-overlay.active')){if(e.key==='Enter')cp();return}
    if(document.querySelector('.modal-overlay.active')){if(e.key==='Escape')cx();return}
    if((e.key==='Enter'||e.key===' ')&&!$('victoryScreen').classList.contains('active')){e.preventDefault();nd()}
  });
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(S.bgAspect>0)rep()},100)});
  S.lv=0;renderLevel();
});
</script>
</body>
